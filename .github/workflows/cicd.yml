name: CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  validar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verificar versão do Python
        run: python --version

      - name: Verificar sintaxe do código
        run: python -m py_compile function_app.py

      - name: Instalar ferramentas de qualidade
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff black isort

      - name: Linting com Ruff
        run: ruff check function_app.py --select E,F,W

      - name: Verificar formatação com Black
        run: black --check function_app.py

      - name: Verificar imports com isort
        run: isort --check-only --profile black function_app.py


  deploy:
    runs-on: ubuntu-latest

    needs: validar

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Deploy para Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: funcapp-felipem001
          package: .
          sku: flexconsumption
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          remote-build: true
          respect-funcignore: true